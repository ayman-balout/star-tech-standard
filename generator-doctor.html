<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generator Doctor | Star Tech Standard Ltd</title>

<style>
body{
font-family:Arial,sans-serif;
margin:0;
background:#f3f5f7;
color:#222;
}
.container{
max-width:700px;
margin:25px auto;
padding:20px;
}
.card{
background:white;
padding:25px;
border-radius:14px;
box-shadow:0 2px 12px rgba(0,0,0,.12);
}
h1{
margin-top:0;
}
p{
line-height:1.5;
}
label{
display:block;
font-weight:bold;
margin-top:18px;
}
input,select,textarea,button{
width:100%;
box-sizing:border-box;
padding:13px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}
textarea{
min-height:130px;
}
button{
background:#111;
color:white;
border:none;
font-weight:bold;
margin-top:22px;
}
.note{
background:#fff4d6;
padding:12px;
border-radius:8px;
margin-top:18px;
font-size:14px;
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>🔧 Generator Doctor</h1>

<p>
Describe your generator problem and Generator Doctor will help identify the possible cause.
</p>

<label>Generator Brand</label>
<select id="brand">
<option>Perkins</option>
<option>Cummins</option>
<option>Caterpillar (CAT)</option>
<option>Lovol</option>
<option>Other</option>
</select>

<label>Generator Size</label>
<input id="kva" type="text" placeholder="Example: 100 kVA">

<label>Problem</label>
<select id="problemType">
<option>Generator will not start</option>
<option>Generator starts then stops</option>
<option>Low or high voltage</option>
<option>Overheating</option>
<option>Low oil pressure</option>
<option>Black smoke</option>
<option>White smoke</option>
<option>Excessive fuel consumption</option>
<option>Battery / starting problem</option>
<option>Other problem</option>
</select>

<label>Describe the symptoms</label>
<textarea id="symptoms" placeholder="Tell us exactly what happens. Example: The engine cranks normally but does not start."></textarea>

<div class="note">
⚠️ Safety: Never open high-pressure diesel fuel lines while the engine is running. Stop the generator if there is overheating, abnormal noise, smoke, or another dangerous condition.
</div>

<button onclick="checkProblem()">Continue Diagnosis</button>

<div id="result"></div>

</div>
</div>

<script>
function checkProblem(){

let brand=document.getElementById("brand").value;
let kva=document.getElementById("kva").value;
let problem=document.getElementById("problemType").value;
let symptoms=document.getElementById("symptoms").value;

if(symptoms.trim()==""){
alert("Please describe the symptoms first.");
return;
}

document.getElementById("result").innerHTML=
"<div class='note'><b>Information received.</b><br><br>"+
"Brand: "+brand+"<br>"+
"Size: "+kva+"<br>"+
"Problem: "+problem+"<br><br>"+
"We are ready for the next diagnostic step.</div>";
}
</script>

</body>
</html>
