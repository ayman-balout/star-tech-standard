<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR TECH STANDARD LTD</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0d131d;
      color: #ffffff;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: #0b1017;
      border-bottom: 1px solid #1a2332;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-text {
      font-weight: bold;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .chat-btn {
      background-color: #e2b13c;
      color: #000000;
      padding: 8px 16px;
      border-radius: 4px;
      font-weight: bold;
      text-decoration: none;
      font-size: 13px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background-color: #141c2b;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      border: 1px solid #202b3c;
      text-align: center;
    }

    .card-title {
      color: #e2b13c;
      font-size: 22px;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .card-description {
      color: #b0bac9;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <span style="color: #e2b13c; font-size: 20px;">★</span>
      <span class="logo-text">STAR TECH STANDARD LTD</span>
    </div>
    <a href="#" class="chat-btn">Chat with Us</a>
  </header>

  <div class="container">
    <div class="card">
      <h2 class="card-title">STAR TECH STANDARD LTD</h2>
      <p class="card-description">
        Welcome to Star Tech Standard Ltd. Premier engineering and diesel generator services.
      </p>
    </div>
  </div>

</body>
</html>
