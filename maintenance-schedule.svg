<svg width="100%" viewBox="0 0 380 406" xmlns="http://www.w3.org/2000/svg" role="img" style="max-width:500px;display:block;margin:0 auto;font-family:Arial,Helvetica,sans-serif;">
<title>Generator preventive maintenance schedule</title>
<desc>A vertical timeline showing four maintenance milestones: 200 hours general maintenance, 500 hours preventive inspection of turbocharger and coolant system, 5000 hours report and top overhaul, and up to 10000 hours general overhaul based on engine condition.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="20" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="40" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">200 hours</text>
<text x="190" y="58" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">General maintenance</text>
<line x1="190" y1="76" x2="190" y2="106" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="106" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="190" y="126" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">500 hours</text>
<text x="190" y="144" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Turbocharger &amp; coolant inspection</text>
<line x1="190" y1="162" x2="190" y2="192" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="192" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="190" y="212" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">5,000 hours</text>
<text x="190" y="230" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Report &amp; top overhaul</text>
<line x1="190" y1="248" x2="190" y2="278" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="40" y="278" width="300" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="190" y="298" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">Up to 10,000 hours</text>
<text x="190" y="316" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">General overhaul, per engine condition</text>

<text x="190" y="366" text-anchor="middle" font-size="12" fill="#5f5e5a">All intervals follow manufacturer recommendations</text>
</svg>
